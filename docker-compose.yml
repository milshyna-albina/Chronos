services:
  mongo:
    image: mongo:latest
    container_name: chronos-mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - chronos

  api:
    build:
      context: ./API
      dockerfile: Dockerfile
    image: chronos-api:dev
    container_name: chronos-api
    restart: unless-stopped
    env_file: ./API/.env
    ports:
      - "5001:5001"
    volumes:
      - ./API:/app
      - /app/node_modules
    networks:
      - chronos
    depends_on:
      - mongo

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: chronos-client:dev
    container_name: chronos-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - chronos
    depends_on:
      - api

volumes:
  mongo_data:

networks:
  chronos:
    driver: bridge